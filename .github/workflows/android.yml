name: Android CI

on:
  push:
    branches: [ main, master, public ]
  pull_request:
    branches: [ main, master, public ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 不用第三方 setup-android 动作：它自己去下 cmdline-tools，Google 换版本时会 404。
      # ubuntu-latest 镜像自带 ANDROID_SDK_ROOT 与 cmdline-tools/latest，直接用它的。
      - name: Install Android SDK Platform 37.2
        run: |
          SDKM="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --install "platforms;android-37.2"

      - name: Run unit tests and assemble Debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
